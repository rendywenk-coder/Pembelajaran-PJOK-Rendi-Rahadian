<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PJOK Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #d81b60 0%, #880e4f 100%);
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        /* LOGO MEMBULAT GARIS OREN */
        .logo-box {
            width: 120px;
            height: 120px;
            margin: 0 auto 25px;
            border-radius: 50%;
            border: 4px solid #ff9800; /* Garis Oranye */
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(255, 152, 0, 0.4);
        }
        .logo-box img {
            width: 90%;
            height: 90%;
            object-fit: contain;
            border-radius: 50%;
        }
        h2 { color: #880e4f; margin-bottom: 25px; font-weight: 800; }
        input {
            width: 100%; padding: 12px 20px; margin-bottom: 15px;
            border: 2px solid #eee; border-radius: 50px; outline: none;
        }
        button {
            width: 100%; padding: 12px; border-radius: 50px; border: none;
            background: #d81b60; color: white; font-weight: 700; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-box">
            <img src="./assets/img/logo.png" onerror="this.src='./assets/img/logo'" alt="Logo">
        </div>
        <h2>PJOK DIGITAL</h2>
        <form id="loginForm">
            <input type="email" placeholder="Email Sekolah" required>
            <input type="password" placeholder="Password" required>
            <button type="submit">MASUK</button>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').onsubmit = function(e) {
            e.preventDefault();
            window.location.href = "dashboard.html";
        };
    </script>
</body>
</html>
