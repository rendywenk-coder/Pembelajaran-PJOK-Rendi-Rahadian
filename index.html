<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login PJOK</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { height: 100vh; display: flex; align-items: center; justify-content: center; background: #d81b60; }
        .login-card { background: white; padding: 30px; border-radius: 20px; text-align: center; width: 320px; }
        
        /* LOGO MEMBULAT OREN */
        .logo-box {
            width: 100px; height: 100px; margin: 0 auto 20px;
            border-radius: 50%; border: 4px solid #ff9800;
            background: white; display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .logo-box img { width: 100%; height: 100%; object-fit: cover; }

        input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd; }
        .btn-login { width: 100%; padding: 12px; background: #d81b60; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; text-decoration: none; display: block; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-box">
            <img src="./assets/img/logo.png.png?v=99" alt="Logo Sekolah">
        </div>
        <h2 style="margin-bottom:20px; color:#d81b60;">PJOK LOGIN</h2>
        <form action="dashboard.html">
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="Password" required>
            <button type="submit" class="btn-login">MASUK</button>
        </form>
    </div>
</body>
</html>
