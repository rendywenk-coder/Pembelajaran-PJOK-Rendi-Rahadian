<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Premium | PJOK Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a2e; /* Warna gelap agar efek oren terlihat menyala */
        }
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            padding: 50px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        /* CSS AGAR LOGO MEMBULAT & BERGARIS OREN */
        .logo-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            border-radius: 50%;
            padding: 5px; /* Jarak antara garis oren dan logo */
            border: 3px solid #ff9800; /* Garis Oren */
            box-shadow: 0 0 20px rgba(255, 152, 0, 0.6), inset 0 0 20px rgba(255, 152, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            background: white; /* Background putih agar logo terlihat jelas */
            animation: pulse-oren 2s infinite;
        }
        .logo-wrapper img {
            width: 80%;
            height: 80%;
            object-fit: contain;
            border-radius: 50%;
        }
        @keyframes pulse-oren {
            0% { box-shadow: 0 0 10px rgba(255, 152, 0, 0.5); }
            50% { box-shadow: 0 0 30px rgba(255, 152, 0, 0.8); }
            100% { box-shadow: 0 0 10px rgba(255, 152, 0, 0.5); }
        }
        h2 { color: white; letter-spacing: 2px; margin-bottom: 30px; }
        input {
            width: 100%; padding: 15px; margin-bottom: 20px;
            background: rgba(255,255,255,0.1); border: none;
            border-radius: 50px; color: white; outline: none;
        }
        button {
            width: 100%; padding: 15px; border-radius: 50px; border: none;
            background: #ff9800; color: white; font-weight: 800; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-wrapper">
            <img src="./assets/img/logo.png" alt="Logo">
        </div>
        <h2>PJOK LOGIN</h2>
        <form id="loginForm">
            <input type="email" placeholder="Email Sekolah" required>
            <input type="password" placeholder="Password" required>
            <button type="submit">MASUK</button>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').onsubmit = function(e) {
            e.preventDefault();
            window.location.href = "dashboard.html";
        };
    </script>
</body>
</html>
