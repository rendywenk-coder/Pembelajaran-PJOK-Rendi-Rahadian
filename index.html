<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Eksklusif | PJOK Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-glass {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 50px 40px;
            border-radius: 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
            color: white;
        }

        .logo-login {
            width: 110px;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h2 { font-size: 28px; font-weight: 800; letter-spacing: 2px; margin-bottom: 5px; }
        p { font-size: 14px; opacity: 0.8; margin-bottom: 30px; }

        .input-group { position: relative; margin-bottom: 25px; }
        input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            color: white;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }
        input::placeholder { color: rgba(255,255,255,0.6); }
        input:focus { background: rgba(255,255,255,0.25); border-color: #fff; }

        button {
            width: 100%;
            padding: 15px;
            border-radius: 50px;
            border: none;
            background: #fff;
            color: #e73c7e;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: 0.4s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        button:hover {
            transform: scale(1.05);
            background: #e73c7e;
            color: white;
            box-shadow: 0 15px 25px rgba(231, 60, 126, 0.4);
        }
    </style>
</head>
<body>

    <div class="login-glass">
        <img src="./assets/img/logo.png" alt="Logo" class="logo-login">
        <h2>PJOK DIGITAL</h2>
        <p>Smart Learning Solution</p>
        
        <form id="loginForm">
            <div class="input-group">
                <input type="email" placeholder="Email Sekolah" required>
            </div>
            <div class="input-group">
                <input type="password" placeholder="Password" required>
            </div>
            <button type="submit">MASUK</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').onsubmit = function(e) {
            e.preventDefault();
            window.location.href = "dashboard.html";
        };
    </script>
</body>
</html>
