<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMINISTRASI PJOK - KELAS 5</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>

    <style>
        /* TEMA ORANGE (KHAS KELAS 5) */
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #fff3e0; margin: 0; padding: 20px; }
        
        /* LOGIN */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ff9800; display: flex; justify-content: center; align-items: center; z-index: 999; }
        .login-box { background: white; padding: 30px; border-radius: 10px; width: 300px; text-align: center; }
        .btn-masuk { width: 100%; padding: 10px; background: #ef6c00; color: white; border: none; border-radius: 5px; cursor: pointer; }

        /* DASHBOARD */
        #dashboard-area { display: none; max-width: 1200px; margin: 0 auto; }
        .header { background: #ff9800; color: white; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-back { background: white; color: #ff9800; text-decoration: none; padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 14px; margin-right: 10px; }
        .btn-logout { background: #d32f2f; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }

        /* PANEL */
        .panel { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; border-top: 4px solid #ff9800; }
        .grid-remote { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .btn-remote { padding: 12px; border: none; border-radius: 5px; color: white; cursor: pointer; font-weight: bold; font-size: 12px; }
        .bg-smt1 { background: #ffa726; }
        .bg-smt2 { background: #fb8c00; }
        .bg-ujian { background: #fbc02d; color: black; }

        /* SAKLAR */
        .grid-saklar { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 10px; }
        .card-saklar { background: #f5f5f5; padding: 10px; border-radius: 5px; text-align: center; border: 1px solid #ddd; }
        .switch-box { display: flex; margin-top: 5px; border-radius: 4px; overflow: hidden; border: 1px solid #ccc; }
        .btn-switch { flex: 1; padding: 5px; border: none; cursor: pointer; font-size: 11px; font-weight: bold; }
        .on-active { background: #4caf50; color: white; }
        .off-active { background: #f44336; color: white; }
        .inactive { background: #eceff1; color: #999; }

        /* TABEL */
        table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background: #ff9800; color: white; }
        
        #status-log { position: fixed; bottom: 10px; right: 10px; background: rgba(0,0,0,0.8); color: white; padding: 5px 15px; border-radius: 20px; font-size: 12px; display: none; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>ADMIN KELAS 5</h2>
            <input type="password" id="passInput" placeholder="Password Guru..." style="width:100%; padding:10px; margin:10px 0;">
            <button class="btn-masuk" onclick="cekLogin()">MASUK</button>
        </div>
    </div>

    <div id="dashboard-area">
        <div class="header">
            <h3>PANEL KONTROL KELAS 5</h3>
            <div>
                <a href="../../dashboard.html" class="btn-back">⬅ Menu Utama</a>
                <button class="btn-logout" onclick="logout()">Keluar</button>
            </div>
        </div>

        <div class="panel">
            <h3>🎮 REMOTE NAVIGASI</h3>
            <div class="grid-remote">
                <button class="btn-remote bg-smt1" onclick="kirim('navigate','a')">A. BOLA BESAR</button>
                <button class="btn-remote bg-smt1" onclick="kirim('navigate','b')">B. BOLA KECIL</button>
                <button class="btn-remote bg-smt1" onclick="kirim('navigate','c')">C. ATLETIK</button>
                <button class="btn-remote bg-smt1" onclick="kirim('navigate','d')">D. BELA DIRI</button>
                <button class="btn-remote bg-ujian" onclick="kirim('navigate','sts')">STS</button>
                <button class="btn-remote bg-smt2" onclick="kirim('navigate','e')">E. KEBUGARAN</button>
                <button class="btn-remote bg-smt2" onclick="kirim('navigate','f')">F. SENAM LANTAI</button>
                <button class="btn-remote bg-smt2" onclick="kirim('navigate','g')">G. IRAMA</button>
                <button class="btn-remote bg-smt2" onclick="kirim('navigate','h')">H. RENANG</button>
                <button class="btn-remote bg-ujian" onclick="kirim('navigate','sas')">SAS</button>
            </div>
        </div>

        <div class="panel">
            <h3>🔓 BUKA/TUTUP SOAL</h3>
            <div class="grid-saklar" id="area-saklar"></div>
        </div>

        <div class="panel">
            <h3>📊 NILAI SISWA</h3>
            <button onclick="loadNilai()" style="background:#2196f3; color:white; border:none; padding:5px 10px;">🔄 Refresh</button>
            <button onclick="dlExcel()" style="background:#4caf50; color:white; border:none; padding:5px 10px;">📥 Excel</button>
            <button onclick="resetNilai()" style="background:#f44336; color:white; border:none; padding:5px 10px; float:right;">🗑️ Hapus</button>
            <div style="overflow-x:auto; margin-top:10px;">
                <table id="tabel-nilai">
                    <thead><tr><th>Nama</th><th>Kelas</th><th>A</th><th>B</th><th>C</th><th>D</th><th>STS</th><th>E</th><th>F</th><th>G</th><th>H</th><th>SAS</th></tr></thead>
                    <tbody id="body-nilai"><tr><td colspan="12">Memuat...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="status-log">Terkirim!</div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyD7FsbgyUF1jvDvcrb6wrWlEiQJUFZG3kE", authDomain: "pjok-sekolah-bapak-rendi.firebaseapp.com", projectId: "pjok-sekolah-bapak-rendi", databaseURL: "https://pjok-sekolah-bapak-rendi-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const broadcast = new BroadcastChannel('pjok_kelas_5'); // KELAS 5

        function cekLogin() {
            if(document.getElementById('passInput').value === 'PJOKRENDI123') {
                sessionStorage.setItem('login_k5', 'true');
                tampilDashboard();
            } else { alert("Password Salah!"); }
        }
        function logout() { sessionStorage.removeItem('login_k5'); location.reload(); }
        if(sessionStorage.getItem('login_k5') === 'true') tampilDashboard();

        function tampilDashboard() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard-area').style.display = 'block';
            renderTombolSaklar(); syncSaklar(); loadNilai();
        }

        function kirim(aksi, target) {
            broadcast.postMessage({ action: aksi, target: target });
            const log = document.getElementById('status-log');
            log.style.display = 'block'; setTimeout(() => log.style.display = 'none', 1000);
        }

        function renderTombolSaklar() {
            const list = ['a','b','c','d','sts','e','f','g','h','sas'];
            let html = '';
            list.forEach(k => {
                html += `<div class="card-saklar" id="card-${k}"><strong>${k.toUpperCase()}</strong><div class="switch-box"><button class="btn-switch inactive" id="on-${k}" onclick="setSaklar('${k}', true)">ON</button><button class="btn-switch off-active" id="off-${k}" onclick="setSaklar('${k}', false)">OFF</button></div></div>`;
            });
            document.getElementById('area-saklar').innerHTML = html;
        }

        function syncSaklar() {
            db.ref('kontrol_ujian_k5').on('value', (snap) => {
                const data = snap.val() || {};
                ['a','b','c','d','sts','e','f','g','h','sas'].forEach(k => {
                    const isOn = data[k] === true;
                    document.getElementById(`on-${k}`).className = `btn-switch ${isOn ? 'on-active' : 'inactive'}`;
                    document.getElementById(`off-${k}`).className = `btn-switch ${!isOn ? 'off-active' : 'inactive'}`;
                });
            });
        }
        function setSaklar(k, v) { db.ref('kontrol_ujian_k5').update({ [k]: v }); }

        function loadNilai() {
            db.ref('rekap_nilai_k5').once('value', (snap) => {
                const data = snap.val();
                const tbody = document.getElementById('body-nilai');
                if(!data) { tbody.innerHTML = '<tr><td colspan="12">Belum ada data.</td></tr>'; return; }
                let siswa = {};
                Object.values(data).forEach(d => {
                    const key = d.nama + '_' + d.kelas;
                    if(!siswa[key]) siswa[key] = {nama: d.nama, kelas: d.kelas, n: {}};
                    siswa[key].n[d.ujian] = d.nilai;
                });
                let html = '';
                Object.values(siswa).sort((a,b)=>a.kelas.localeCompare(b.kelas)).forEach(s => {
                    html += `<tr><td>${s.nama}</td><td>${s.kelas}</td><td>${s.n.a||'-'}</td><td>${s.n.b||'-'}</td><td>${s.n.c||'-'}</td><td>${s.n.d||'-'}</td><td style="background:#fff9c4; font-weight:bold;">${s.n.sts||'-'}</td><td>${s.n.e||'-'}</td><td>${s.n.f||'-'}</td><td>${s.n.g||'-'}</td><td>${s.n.h||'-'}</td><td style="background:#ffcdd2; font-weight:bold;">${s.n.sas||'-'}</td></tr>`;
                });
                tbody.innerHTML = html;
            });
        }

        function dlExcel() {
            const tbl = document.getElementById('tabel-nilai');
            const wb = XLSX.utils.table_to_book(tbl);
            XLSX.writeFile(wb, 'Nilai_K5.xlsx');
        }

        function resetNilai() {
            if(confirm("Hapus nilai Kelas 5?")) { db.ref('rekap_nilai_k5').remove(); loadNilai(); }
        }
    </script>
</body>
</html>
