<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | PJOK Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background: #f0f4f8; display: flex; }
        
        .sidebar {
            width: 280px; background: #1a1a2e; height: 100vh;
            position: fixed; padding: 30px 20px; color: white;
        }

        /* LOGO MEMBULAT OREN DI SIDEBAR */
        .brand-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
        }
        .logo-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #ff9800;
            padding: 3px;
            background: white;
            box-shadow: 0 0 15px rgba(255, 152, 0, 0.5);
            margin-bottom: 10px;
        }
        .logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }

        .main { margin-left: 280px; padding: 40px; width: 100%; }
        .banner {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            padding: 40px; border-radius: 20px; color: white;
            margin-bottom: 30px; box-shadow: 0 10px 25px rgba(245,124,0,0.3);
        }

        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card {
            background: white; padding: 30px; border-radius: 20px;
            text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .btn-buka {
            display: inline-block; margin-top: 20px; padding: 10px 25px;
            background: #1a1a2e; color: white; text-decoration: none; border-radius: 50px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="brand-section">
            <div class="logo-circle">
                <img src="./assets/img/logo.png" alt="Logo">
            </div>
            <h3 style="color: #ff9800;">PJOK PRO</h3>
        </div>
        <nav>
            <p style="padding: 12px; background: rgba(255,152,0,0.2); color: #ff9800; border-radius: 10px; font-weight: bold;">🏠 Dashboard</p>
            <a href="index.html" style="display: block; margin-top: 40px; color: #ff4b2b; text-decoration: none;">🚪 Keluar</a>
        </nav>
    </div>

    <div class="main">
        <div class="banner">
            <h1>Selamat Datang, Guru Hebat!</h1>
            <p>Pilih kelas untuk memulai materi pembelajaran hari ini.</p>
        </div>

        <div class="card-grid">
            <div class="card">
                <h2>KELAS 1</h2>
                <a href="./pages/kelas/materi-kelas-1.html" class="btn-buka">Buka Materi</a>
            </div>
            <div class="card">
                <h2>KELAS 2</h2>
                <a href="./pages/kelas/materi-kelas-2.html" class="btn-buka">Buka Materi</a>
            </div>
        </div>
    </div>
</body>
</html>
