<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard PJOK</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { display: flex; background: #fdf2f5; min-height: 100vh; }
        
        .sidebar { width: 250px; background: white; height: 100vh; position: fixed; padding: 20px; border-right: 1px solid #ddd; z-index: 100; }
        .logo-samping { width: 60px; height: 60px; border-radius: 50%; border: 3px solid #ff9800; overflow: hidden; margin-bottom: 15px; background: white; display: flex; align-items: center; justify-content: center; }
        
        .main { margin-left: 250px; padding: 30px; width: 100%; }
        .banner { background: #d81b60; color: white; padding: 30px; border-radius: 20px; margin-bottom: 30px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; padding: 25px; border-radius: 20px; text-align: center; border-bottom: 5px solid #ff9800; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .card i { font-size: 50px; display: block; margin-bottom: 10px; font-style: normal; }
        
        .btn { display: inline-block; margin-top: 15px; padding: 10px 25px; background: #d81b60; color: white; text-decoration: none; border-radius: 50px; font-weight: bold; }

        @media (max-width: 768px) { .sidebar { display: none; } .main { margin-left: 0; } }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo-samping">
            <img src="assets/img/logo.png" onerror="this.src='assets/img/logo'" style="width:100%;">
        </div>
        <h2 style="color:#d81b60; font-size: 18px;">PJOK DIGITAL</h2>
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        <a href="index.html" style="text-decoration:none; color:#666; font-weight:bold;">🚪 Keluar</a>
    </div>

    <div class="main">
        <div class="banner">
            <h1>Selamat Datang</h1>
            <p>Silakan pilih materi kelas:</p>
        </div>

        <div class="grid">
            <div class="card"><i>🏃‍♂️</i><h3>KELAS 1</h3><a href="pages/kelas/materi-kelas-1.html" class="btn">BUKA</a></div>
            <div class="card"><i>🏐</i><h3>KELAS 2</h3><a href="pages/kelas/materi-kelas-2.html" class="btn">BUKA</a></div>
            <div class="card"><i>🎾</i><h3>KELAS 3</h3><a href="pages/kelas/materi-kelas-3.html" class="btn">BUKA</a></div>
            <div class="card"><i>⚽</i><h3>KELAS 4</h3><a href="pages/kelas/materi-kelas-4.html" class="btn">BUKA</a></div>
            <div class="card"><i>🏀</i><h3>KELAS 5</h3><a href="pages/kelas/materi-kelas-5.html" class="btn">BUKA</a></div>
            <div class="card"><i>🏸</i><h3>KELAS 6</h3><a href="pages/kelas/materi-kelas-6.html" class="btn">BUKA</a></div>
        </div>
    </div>
</body>
</html>
