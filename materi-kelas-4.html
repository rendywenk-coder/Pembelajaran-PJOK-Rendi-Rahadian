                {q:"Gerakan kayang dilakukan dengan melengkungkan badan ke atas bertumpu pada tangan dan kaki. Gerakan ini melatih kelenturan otot...", o:["Punggung dan pinggang","Leher","Jari","Telinga"], a:"Punggung dan pinggang"},
                {q:"Alas yang digunakan untuk senam lantai agar tubuh tidak sakit saat berbenturan dengan lantai adalah...", o:["Matras","Karpet tipis","Tikar","Rumput"], a:"Matras"},
                {q:"Gerakan Sit-up dilakukan dengan tidur telentang lalu bangun duduk. Latihan ini dikhususkan untuk menguatkan otot...", o:["Perut","Punggung","Kaki","Tangan"], a:"Perut"},
                {q:"Pada renang gaya bebas, gerakan tangan mengayun memutar ke depan secara bergantian. Gerakan ini mirip dengan...", o:["Kincir angin","Lompatan katak","Sayap burung","Mendayung"], a:"Kincir angin"},
                {q:"Sikap awal yang benar sebelum melakukan gerakan guling depan bisa dimulai dengan...", o:["Jongkok atau berdiri","Tidur telentang","Duduk selonjor","Tidur tengkurap"], a:"Jongkok atau berdiri"},
                {q:"Senam irama yang dilakukan secara berkelompok membutuhkan kerja sama tim yang baik, yaitu...", o:["Kekompakan gerakan","Persaingan","Kecepatan","Mahalnya seragam"], a:"Kekompakan gerakan"},
                {q:"Tujuan utama melakukan pemanasan (warming up) sebelum berenang adalah...", o:["Mencegah kram otot","Agar badan wangi","Agar air hangat","Supaya tidak lapar"], a:"Mencegah kram otot"},
                {q:"Latihan Back-up (mengangkat punggung saat telungkup) bertujuan melatih otot...", o:["Punggung","Perut","Kaki","Leher"], a:"Punggung"},
                {q:"Gerakan meroda adalah memutar tubuh ke samping. Tumpuan utama saat badan berputar adalah...", o:["Kedua tangan","Satu kaki","Kepala","Punggung"], a:"Kedua tangan"},
                {q:"Berikut ini yang merupakan contoh irama pengiring senam adalah...", o:["Musik, ketukan, atau hitungan","Teriakan","Suara klakson","Bunyi peluit"], a:"Musik, ketukan, atau hitungan"},
                {q:"Gerakan langkah kaki dalam senam irama bisa divariasikan dengan...", o:["Ayunan lengan","Tendangan","Pukulan","Lemparan"], a:"Ayunan lengan"},
                {q:"Pakaian renang yang baik sebaiknya terbuat dari bahan yang...", o:["Ringan tidak menyerap air","Tebal dan berat","Jeans","Wol panas"], a:"Ringan tidak menyerap air"},
                {q:"Seseorang dikatakan memiliki kebugaran jasmani yang baik apabila...", o:["Tidak mudah lelah beraktivitas","Cepat mengantuk","Mudah sakit","Selalu lemas"], a:"Tidak mudah lelah beraktivitas"},
                {q:"Kemampuan tubuh beraktivitas tanpa lelah berlebih disebut..."},
                {q:"Pencak silat berasal dari negara..."},
                {q:"Alas untuk senam lantai disebut..."},
                {q:"Senam yang diiringi musik disebut senam..."},
                {q:"Posisi badan renang gaya bebas adalah..."},
                {q:"Sikap lilin kaki diangkat lurus ke..."},
                {q:"Lari zig-zag melatih..."},
                {q:"Napas gaya bebas menoleh ke..."},
                {q:"Gerakan pendinginan dilakukan setelah..."},
                {q:"Contoh alat senam irama adalah..."},
                {q:"Sebutkan 3 contoh latihan kekuatan otot!"},
                {q:"Jelaskan cara melakukan guling depan!"},
                {q:"Apa yang dimaksud dengan senam irama?"},
                {q:"Jelaskan gerakan kaki renang gaya bebas!"},
                {q:"Mengapa wajib pemanasan sebelum renang?"}
            ]
        };

        // --- 3. FIREBASE CONNECT ---
        const config = { apiKey: "AIzaSyD7FsbgyUF1jvDvcrb6wrWlEiQJUFZG3kE", authDomain: "pjok-sekolah-bapak-rendi.firebaseapp.com", projectId: "pjok-sekolah-bapak-rendi", storageBucket: "pjok-sekolah-bapak-rendi.firebasestorage.app", messagingSenderId: "337016584526", appId: "1:337016584526:web:8534c7cf4012a35427861f", databaseURL: "https://pjok-sekolah-bapak-rendi-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(config);
        const db = firebase.database();

        db.ref('.info/connected').on('value',s=>{ document.getElementById('conn').innerText=s.val()?"🟢 ONLINE":"🔴 OFFLINE"; });

        // REMOTE CONTROL
        db.ref('kontrol_ujian_k4').on('value',snap=>{
            const d=snap.val()||{};
            for(let k in data){
                const b=document.getElementById('box-'+k);
                if(b) b.style.display=d[k]?'block':'none';
                const m=document.getElementById('msg-'+k);
                if(m) m.style.display=d[k]?'none':'block';
            }
        });

        window.toggleKisi = function(id) {
            const el = document.getElementById(id);
            el.style.display = (el.style.display === 'block') ? 'none' : 'block';
        };

        // NAVIGASI & TAMPILAN
        window.buka=function(id,btn){
            document.querySelectorAll('.btn-nav').forEach(e=>e.classList.remove('active'));
            if(btn) btn.classList.add('active');
            const inf=data[id];
            
            let videoHTML = (inf.v && id!='sts' && id!='sas') ? `<div class="video-box"><iframe src="https://www.youtube.com/embed/${inf.v}" allowfullscreen></iframe></div>` : '';

            document.getElementById('display').innerHTML=`
                <div class="section active">
                    <h2>${inf.t}</h2>
                    ${videoHTML}
                    <div class="rangkuman">${inf.d}</div>
                    <div id="box-${id}" class="box-remote">
                        <h3 style="color:green">🔥 UJIAN DIBUKA 🔥</h3>
                        <button class="btn-start" onclick="load('${id}')">KERJAKAN SEKARANG</button>
                        <button class="btn-pdf" onclick="dlPDF('${id}')">UNDUH SOAL PDF</button>
                    </div>
                    <div id="msg-${id}" style="text-align:center;color:#999;margin-top:20px">(Menunggu Guru membuka akses...)</div>
                </div>`;
            document.getElementById('quiz-area').style.display='none';
            db.ref('kontrol_ujian_k4').once('value',snap=>{
                if((snap.val()||{})[id]){ document.getElementById('box-'+id).style.display='block'; document.getElementById('msg-'+id).style.display='none'; }
            });
        }

        // LOAD SOAL (LOGIC UTAMA)
        window.load=function(k){
            let h=`<div class="form-box"><h3>DATA SISWA</h3>
            <div class="form-group"><label>Nama Lengkap:</label><input type="text" id="nama" class="form-control"></div>
            <div class="form-group"><label>Nama Guru:</label><input type="text" id="guru" class="form-control" value="Pak Rendi" readonly></div>
            <div class="form-group"><label>Asal Sekolah:</label><input type="text" id="sekolah" class="form-control"></div>
            <div class="form-group"><label>Kelas:</label><select id="kelas" class="form-control"><option>4A</option><option>4B</option><option>4C</option><option>4D</option><option>4E</option><option>4F</option></select></div></div>`;
            
            const list=dbSoal[k] || [];
            
            // FILTER SOAL
            const pgs = list.filter(x => x.o); // Punya opsi = PG
            
            // Isian dan Essay dibedakan:
            // Jika ada properti t:'is', itu Isian.
            // Jika ada properti t:'es', itu Essay.
            // Jika tidak ada properti t tapi tidak ada o (opsi), anggap isian/essay default.
            // Untuk STS/SAS, kita tahu pasti struktur 35 soalnya.
            
            // Logic Penyekatan:
            if(pgs.length>0){
                h+=`<div class="judul-bagian">I. PILIHAN GANDA</div>`;
                pgs.forEach((s,i)=>{
                    h+=`<div class="soal-card"><div class="soal-text"><strong>${i+1}.</strong> ${s.q}</div>`;
                    s.o.forEach((o,ix)=>{ h+=`<label class="opsi-label"><input type="radio" name="pg${i}" value="${o}"> ${o}</label>`; });
                    h+=`</div>`;
                });
            }

            if(k === 'sts' || k === 'sas'){
                // Logic khusus 35 soal (20 PG + 10 IS + 5 ES)
                // Kita ambil manual dari array karena urutannya sudah pasti
                // 0-19: PG
                // 20-29: Isian
                // 30-34: Essay
                
                h+=`<div class="judul-bagian">II. ISIAN SINGKAT</div>`;
                for(let i=20; i<30; i++){
                    if(list[i]) h+=`<div class="soal-card"><div class="soal-text"><strong>${i+1}.</strong> ${list[i].q}</div><input type="text" class="form-control"></div>`;
                }

                h+=`<div class="judul-bagian">III. URAIAN</div>`;
                for(let i=30; i<35; i++){
                    if(list[i]) h+=`<div class="soal-card"><div class="soal-text"><strong>${i+1}.</strong> ${list[i].q}</div><textarea class="form-control" rows="3"></textarea></div>`;
                }

            } else {
                // Kuis Harian (A-H): 20 PG + 5 Essay
                // Bagian II hanya Uraian
                const essays = list.filter(x => !x.o); // Semua yang bukan PG adalah uraian
                if(essays.length > 0){
                    h+=`<div class="judul-bagian">II. URAIAN</div>`;
                    essays.forEach((s,i)=>{
                        // Nomor uraian melanjutkan dari jumlah PG
                        h+=`<div class="soal-card"><div class="soal-text"><strong>${pgs.length+i+1}.</strong> ${s.q}</div><textarea class="form-control" rows="3"></textarea></div>`;
                    });
                }
            }

            h+=`<button class="btn-start" onclick="kirim('${k}')">KIRIM JAWABAN SAYA</button>`;
            const a=document.getElementById('quiz-area'); a.innerHTML=h; a.style.display='block'; a.scrollIntoView({behavior:'smooth'});
        }

        window.kirim=function(k){
            const n=document.getElementById('nama').value;
            const sek=document.getElementById('sekolah').value;
            if(!n||!sek) return alert("Isi Nama & Sekolah!");
            let ben=0; const list=dbSoal[k].filter(x=>x.o);
            list.forEach((s,i)=>{ if(document.querySelector(`input[name="pg${i}"]:checked`)?.value==s.a) ben++; });
            let val=list.length>0 ? Math.round((ben/list.length)*100) : 0;
            db.ref('rekap_nilai_k4').push({nama:n, guru:document.getElementById('guru').value, kelas:document.getElementById('kelas').value, sekolah:sek, ujian:k.toUpperCase(), nilai:val, tanggal:new Date().toISOString().split('T')[0]});
            alert('Nilai PG: '+val); location.reload();
        }

        window.dlPDF=function(k){
            const doc=new window.jspdf.jsPDF();
            doc.text(`SOAL ${k.toUpperCase()} PJOK KELAS 4`,10,10);
            doc.save(`Soal_${k}.pdf`);
        }

        buka('a',document.querySelector('.btn-nav'));
    </script>
</body>
</html>
