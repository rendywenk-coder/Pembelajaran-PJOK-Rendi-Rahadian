<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PJOK Digital</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background-color: #e0f2f1; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        .login-logo { width: 80px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; color: #555; font-weight: bold; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 8px; box-sizing: border-box; font-size: 16px; transition: 0.3s; }
        .form-group input:focus { border-color: #009688; outline: none; }
        .btn-login { width: 100%; padding: 12px; background: #009688; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .btn-login:hover { background: #00796b; }
        .back-link { display: block; margin-top: 20px; color: #888; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #009688; }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="assets/img/logo.png" alt="Logo" class="login-logo">
        <h2 style="color: #00695c; margin-top: 0;">Masuk Akun</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 30px;">Silakan login untuk mengakses materi.</p>

        <div class="form-group">
            <label>Peran Pengguna</label>
            <select id="roleSelect" style="width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 8px;">
                <option value="siswa">Siswa</option>
                <option value="guru">Guru (Admin)</option>
            </select>
        </div>

        <div class="form-group" id="passGroup" style="display:none;">
            <label>Password Guru</label>
            <input type="password" id="adminPass" placeholder="Masukkan Kode...">
        </div>

        <button class="btn-login" onclick="handleLogin()">MASUK SEKARANG</button>
        <a href="index.html" class="back-link">Kembali ke Beranda</a>
    </div>

    <script>
        // Logika Sederhana Login
        const roleSelect = document.getElementById('roleSelect');
        const passGroup = document.getElementById('passGroup');

        roleSelect.addEventListener('change', function() {
            if(this.value === 'guru') {
                passGroup.style.display = 'block';
            } else {
                passGroup.style.display = 'none';
            }
        });

        function handleLogin() {
            const role = roleSelect.value;
            
            if(role === 'siswa') {
                // Siswa langsung masuk dashboard
                window.location.href = 'dashboard.html';
            } else {
                // Guru cek password
                const pass = document.getElementById('adminPass').value;
                if(pass === 'PJOKRENDI123') {
                    // Karena Admin punya banyak kelas, kita arahkan ke Dashboard Admin (Bisa buat file dashboard-admin.html atau pilih manual)
                    // Untuk saat ini, kita arahkan ke dashboard umum dulu, nanti di sana Guru pilih "Admin Kelas X"
                    alert("Login Guru Berhasil!");
                    window.location.href = 'dashboard.html'; 
                    // Atau jika Bapak mau langsung pilih kelas admin, bisa diarahkan ke halaman khusus.
                } else {
                    alert("Password Guru Salah!");
                }
            }
        }
    </script>
</body>
</html>
